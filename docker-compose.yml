# cet4-platform 一键起服务：MySQL + Redis + Spring Boot + nginx
# 单入口：http://localhost/

name: cet4-platform

services:
  mysql:
    image: mysql:8.0
    container_name: cet4-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${CET4_MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: cet4_platform
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅在数据卷为空（首次启动）时按文件名顺序执行：init.sql 后接全部种子
      - ./backend/src/main/resources/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: cet4-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cet4-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # dev profile + 环境变量覆盖 127.0.0.1 的默认地址
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cet4_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${CET4_MYSQL_ROOT_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      JWT_SECRET: ${CET4_JWT_SECRET:-change-me-cet4-platform-jwt-secret-key-32}
      DEEPSEEK_API_KEY: ${CET4_DEEPSEEK_API_KEY:-sk-placeholder}
      TZ: Asia/Shanghai
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    container_name: cet4-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${CET4_APP_PORT:-80}:80"

volumes:
  mysql-data:
  redis-data: